name: Bug report
description: Something in Atlas does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys** — remove them from any output below.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. atlas
        2. /connect …
        3. …
  - type: textarea
    id: doctor
    attributes:
      label: Output of `atlas doctor`
      description: Shows OS, terminal, Node.js and provider status. Check it has no keys.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atlas version (`atlas --version`)
      placeholder: "0.1.0"
    validations:
      required: true
